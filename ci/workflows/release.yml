name: Kite Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

jobs:
  build-release:
    name: Build Windows 11 Release Artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Build & Package Windows Distribution
        shell: pwsh
        run: |
          .\tools\package.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kite Windows v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/KiteWin-${{ steps.ver.outputs.version }}-win-x64.zip
            dist/checksums.txt
          body: |
            ## Kite v${{ steps.ver.outputs.version }} (Windows 11)

            ### Release Artifacts
            - **Standalone Package:** `KiteWin-${{ steps.ver.outputs.version }}-win-x64.zip`
            - **Verification:** Checksums provided in `checksums.txt`

            ### Standards Compliance
            - 100% Windows 11 BAWA Standard (4 epx grid)
            - 100% Zero Emojis (Native Segoe Fluent Icons)
            - PerMonitorV2 High DPI Awareness
