name: Kite Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Windows 11 BAWA Quality Gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Windows 11 BAWA 4 epx & Zero Emojis Standards
        run: |
          python tools/quality_gate.py

      - name: Build WinUI 3 Release
        run: |
          dotnet build src/KiteWin/KiteWin.csproj -c Release

      - name: Run Release Preflight Distribution Audit
        run: |
          python tools/kite-cli dist-check
